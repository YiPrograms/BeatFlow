name: Feature request
description: Propose a focused player or contributor improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Player problem
      description: Describe what is difficult today and when it happens.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
      description: Describe the visible result rather than only an implementation.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Area
      options:
        - Up Next
        - For You
        - Matching and filters
        - Downloads
        - Privacy and account connection
        - Contributor tooling
        - Other
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives and constraints
